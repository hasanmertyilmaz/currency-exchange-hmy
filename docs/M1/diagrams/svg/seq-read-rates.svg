3" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;" x1="1133.9263" x2="1324.2725" y1="383" y2="383"/><text fill="#000000" font-family="Helvetica" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="7.23" x="1145.9263" y="378.0103">9</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="53.46" x="1157.1563" y="378.0103">rate rows</text></g><g class="message" data-participant-1="WS" data-participant-2="Api"><polygon fill="#181818" points="795.394,406,785.394,410,795.394,414,791.394,410" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;" x1="789.394" x2="1127.9263" y1="410" y2="410"/><text fill="#000000" font-family="Helvetica" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="14.46" x="801.394" y="405.0103">10</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="302.0723" x="819.854" y="405.0103">200 {tableNo, effectiveDate, fetchedAt, stale, rates[]}</text></g><g class="message" data-participant-1="Api" data-participant-2="Repo"><polygon fill="#181818" points="485.6445,433,475.6445,437,485.6445,441,481.6445,437" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;" x1="479.6445" x2="783.394" y1="437" y2="437"/><text fill="#000000" font-family="Helvetica" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="14.46" x="491.6445" y="432.0103">11</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="59.979" x="510.1045" y="432.0103">RateTable</text></g><g class="message" data-participant-1="Repo" data-participant-2="Cache"><polygon fill="#181818" points="687.022,460,697.022,464,687.022,468,691.022,464" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="474.6445" x2="693.022" y1="464" y2="464"/><text fill="#000000" font-family="Helvetica" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="14.46" x="481.6445" y="459.0103">12</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="181.9175" x="500.1045" y="459.0103">save("rates:current", data, now)</text></g><g class="message" data-participant-1="Repo" data-participant-2="UI"><polygon fill="#181818" points="135.501,487,125.501,491,135.501,495,131.501,491" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;" x1="129.501" x2="473.6445" y1="491" y2="491"/><text fill="#000000" font-family="Helvetica" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="14.46" x="141.501" y="486.0103">13</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="307.6836" x="159.9609" y="486.0103">show current data, label "Live &#183; NBP table &lt;tableNo&gt;"</text></g><path d="M746,504 L746,566 L1166,566 L1166,514 L1156,504 L746,504" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1156,504 L1156,514 L1166,514 L1156,504" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="211.7197" x="800.1365" y="519.0103">Network error, timeout, 502/503/504:</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="298.3081" x="800.1365" y="532.0103">retry up to 3 attempts (1 s, 2 s backoff &#177; 20 % jitter).</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="302.7832" x="800.1365" y="545.0103">After the last failure the cached data stays on screen</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="244.0928" x="800.1365" y="558.0103">with an "offline / could not refresh" banner.</text><!--SRC=[RLJDRjD0